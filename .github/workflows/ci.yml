name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -r backend/requirements-dev.txt
      - name: Curriculum file is up to date with its sources
        run: python scripts/build_curriculum.py --check
      - name: Content integrity
        run: cd backend && python -m app.cli check-content
      - name: Backend and engine tests (includes phone/server parity)
        run: cd backend && python -m pytest -q
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -r backend/requirements.txt
      - run: npm install playwright && npx playwright install --with-deps chromium
      - name: Browser end-to-end
        run: |
          cd backend
          SEED_DEMO=1 SECRET_KEY=ci-secret-ci-secret-ci-secret-0123456789 DATABASE_URL=sqlite:///./ci.db uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          cd .. && node scripts/e2e.js http://localhost:8000
