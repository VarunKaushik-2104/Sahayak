# One-click deploy on Render: New > Blueprint > pick this repo. Free web service + free Postgres.
services:
  - type: web
    name: sahayak
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: sahayak-db, property: connectionString }
      - key: SEED_DEMO
        value: "1"
      - key: SMS_BACKEND
        value: console
databases:
  - name: sahayak-db
    plan: free
