# One-click deploy on Render: New > Blueprint > pick this repo. Free web service + free Postgres.
services:
  - type: web
    name: sahayak
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: sahayak-db, property: connectionString }
      - key: SITE_URL
        value: https://sahayak-ypqu.onrender.com   # change to your own address; used for canonical links and the sitemap
      - key: CONTACT_EMAIL
        sync: false                                 # optional: shown on the contact page
databases:
  - name: sahayak-db
    plan: free
