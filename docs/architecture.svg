<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2443C4"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker>
    <style>
      .t{font-size:15px;fill:#14213D}.s{font-size:12.5px;fill:#566079}.h{font-size:18px;font-weight:700;fill:#14213D}.lb{font-size:12px;font-weight:700;fill:#2443C4}
      .box{fill:#fff;stroke:#C9D3E8;stroke-width:1.5}.zone{fill:#F2F5FA;stroke:#D6DDEB;stroke-width:1.5}.core{fill:#E8EEFF;stroke:#2443C4;stroke-width:1.5}
      .ok{fill:#E6F4EC;stroke:#2F8F5B;stroke-width:1.5}.warn{fill:#FFF3D6;stroke:#C58A00;stroke-width:1.5}
      .ln{stroke:#2443C4;stroke-width:2;fill:none}.lg{stroke:#667085;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .num{fill:#2443C4}.nt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="1010" fill="#FFFFFF"/>
  <text x="40" y="46" class="h" style="font-size:26px">Sahayak · system architecture</text>
  <text x="40" y="70" class="s">Offline-first web app on the phone, FastAPI + SQLAlchemy on the server, one prerequisite graph for CBSE, ICSE and Telangana, Classes 6 to 10.</text>

  <!-- CLIENTS -->
  <rect x="40" y="95" width="500" height="640" rx="14" class="zone"/>
  <text x="60" y="124" class="h">Clients · installable web app (PWA)</text>
  <rect x="62" y="142" width="456" height="310" rx="10" class="box"/>
  <text x="80" y="170" class="h" style="font-size:16px">Student phone · works with no network</text>
  <rect x="80" y="184" width="200" height="62" rx="8" class="core"/><text x="94" y="208" class="t">Adaptive engine (JS)</text><text x="94" y="228" class="s">learn · solve · check, trace-back</text>
  <rect x="298" y="184" width="200" height="62" rx="8" class="core"/><text x="312" y="208" class="t">Placement, plan, mock</text><text x="312" y="228" class="s">marked by step</text>
  <rect x="80" y="258" width="200" height="62" rx="8" class="box"/><text x="94" y="282" class="t">Syllabus cache</text><text x="94" y="302" class="s">73 topics · 584 questions</text>
  <rect x="298" y="258" width="200" height="62" rx="8" class="warn"/><text x="312" y="282" class="t">Outbox (local storage)</text><text x="312" y="302" class="s">picked option + client id</text>
  <rect x="80" y="332" width="200" height="50" rx="8" class="box"/><text x="94" y="354" class="t">Service worker</text><text x="94" y="372" class="s">app shell + bundle cached</text>
  <rect x="298" y="332" width="200" height="50" rx="8" class="box"/><text x="312" y="354" class="t">Offline PIN check</text><text x="312" y="372" class="s">salted PBKDF2 hash on device</text>
  <text x="80" y="414" class="s">Answers are saved first, then synced when a connection exists.</text>
  <text x="80" y="434" class="s">English · తెలుగు · हिन्दी</text>
  <rect x="62" y="470" width="456" height="116" rx="10" class="box"/>
  <text x="80" y="498" class="h" style="font-size:16px">Teacher dashboard</text>
  <text x="80" y="520" class="s">Heatmap by topic or chapter · morning briefing · worksheets</text>
  <text x="80" y="540" class="s">Groups (move anyone) · set test date and chapters · send practice</text>
  <text x="80" y="562" class="s">Refreshes while open; shows which students have not synced</text>
  <rect x="62" y="602" width="456" height="116" rx="10" class="box"/>
  <text x="80" y="630" class="h" style="font-size:16px">Parent note</text>
  <text x="80" y="652" class="s">Plain weekly note in English, Hindi or Telugu, with the test date</text>
  <text x="80" y="672" class="s">Own child only · no marks, no rank, no other children</text>
  <text x="80" y="694" class="s">Mobile number + one-time code</text>

  <!-- API -->
  <rect x="640" y="95" width="560" height="640" rx="14" class="zone"/>
  <text x="660" y="124" class="h">FastAPI server (Python 3.12)</text>
  <rect x="662" y="140" width="516" height="96" rx="10" class="box"/>
  <text x="680" y="166" class="h" style="font-size:16px">Routers · /api</text>
  <text x="680" y="188" class="s">auth · content (cacheable bundle, ETag) · student · sync · practice</text>
  <text x="680" y="208" class="s">teacher · parent · health      JWT bearer, role checks, school scoping</text>
  <text x="680" y="226" class="s">Pydantic validation · rate-limited OTP · PIN lock after 5 misses</text>
  <rect x="662" y="252" width="516" height="104" rx="10" class="core"/>
  <text x="680" y="278" class="h" style="font-size:16px">Sync service · the server is the authority</text>
  <text x="680" y="300" class="s">Receives picked options only. Marks each one against the curriculum,</text>
  <text x="680" y="320" class="s">replays in time order, clamps bad phone clocks, ignores repeated client ids,</text>
  <text x="680" y="340" class="s">returns the authoritative mastery. A tampered client cannot invent progress.</text>
  <rect x="662" y="372" width="516" height="226" rx="10" class="core"/>
  <text x="680" y="398" class="h" style="font-size:16px">Engine · pure Python, no I/O (backend/app/engine)</text>
  <rect x="680" y="410" width="236" height="52" rx="8" class="box"/><text x="692" y="432" class="t">graph + mastery</text><text x="692" y="450" class="s">transitive prereqs · BKT update</text>
  <rect x="924" y="410" width="236" height="52" rx="8" class="box"/><text x="936" y="432" class="t">practice + trace-back</text><text x="936" y="450" class="s">mistake tag → weak basic</text>
  <rect x="680" y="472" width="236" height="52" rx="8" class="box"/><text x="692" y="494" class="t">planner + mock</text><text x="692" y="512" class="s">dated plan · step-wise marking</text>
  <rect x="924" y="472" width="236" height="52" rx="8" class="box"/><text x="936" y="494" class="t">teacher analytics</text><text x="936" y="512" class="s">groups · briefing · worksheets</text>
  <rect x="680" y="534" width="480" height="52" rx="8" class="box"/><text x="692" y="556" class="t">parent note (EN / HI / TE)</text><text x="692" y="574" class="s">same rules run on the phone; a test proves both give identical results</text>
  <rect x="662" y="614" width="516" height="104" rx="10" class="box"/>
  <text x="680" y="640" class="h" style="font-size:16px">Curriculum · backend/data/curriculum.json</text>
  <text x="680" y="662" class="s">73 topics across Maths and Science, 584 tagged-distractor questions,</text>
  <text x="680" y="682" class="s">chapter maps for CBSE (NCERT), ICSE and Telangana. Built from content_src/</text>
  <text x="680" y="702" class="s">by scripts/build_curriculum.py; validated on start and in CI.</text>

  <!-- DB -->
  <rect x="1300" y="95" width="260" height="640" rx="14" class="zone"/>
  <text x="1320" y="124" class="h">Database</text>
  <text x="1320" y="146" class="s">SQLAlchemy 2.0</text>
  <text x="1320" y="164" class="s">SQLite (dev) · PostgreSQL (prod)</text>
  <rect x="1320" y="182" width="220" height="520" rx="10" class="ok"/>
  <g class="t" font-size="13.5">
    <text x="1336" y="212" font-weight="700">users</text><text x="1336" y="230" class="s">student · teacher · parent</text>
    <text x="1336" y="262" font-weight="700">mastery</text><text x="1336" y="280" class="s">student × topic → P(known)</text>
    <text x="1336" y="312" font-weight="700">attempts</text><text x="1336" y="330" class="s">unique (student, client id)</text>
    <text x="1336" y="362" font-weight="700">mock_results</text><text x="1336" y="380" class="s">score, rows marked by step</text>
    <text x="1336" y="412" font-weight="700">misconceptions</text><text x="1336" y="430" class="s">counts per student</text>
    <text x="1336" y="462" font-weight="700">study_minutes</text><text x="1336" y="480" class="s">per day, for the parent note</text>
    <text x="1336" y="512" font-weight="700">test_plans</text><text x="1336" y="530" class="s">set once by the teacher</text>
    <text x="1336" y="562" font-weight="700">group_overrides</text><text x="1336" y="580" class="s">teacher decisions · assignments</text>
    <text x="1336" y="612" font-weight="700">parent_children</text><text x="1336" y="630" class="s">who may read whose note</text>
    <text x="1336" y="662" font-weight="700">otp_codes · schools</text><text x="1336" y="680" class="s">hashed, expiring, one use</text>
  </g>

  <!-- arrows -->
  <path d="M520 300 H640" class="ln" marker-end="url(#ar)"/>
  <path d="M640 330 H520" class="ln" marker-end="url(#ar)"/>
  <path d="M520 520 H640" class="ln" marker-end="url(#ar)"/>
  <path d="M520 660 H640" class="ln" marker-end="url(#ar)"/>
  <path d="M1200 480 H1300" class="ln" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <circle cx="580" cy="286" r="13" class="num"/><text x="580" y="290.5" class="nt">1</text>
  <circle cx="580" cy="344" r="13" class="num"/><text x="580" y="348.5" class="nt">2</text>
  <circle cx="580" cy="506" r="13" class="num"/><text x="580" y="510.5" class="nt">3</text>
  <circle cx="580" cy="646" r="13" class="num"/><text x="580" y="650.5" class="nt">4</text>
  <circle cx="1250" cy="466" r="13" class="num"/><text x="1250" y="470.5" class="nt">5</text>

  <!-- legend / flow -->
  <rect x="40" y="760" width="1520" height="215" rx="14" class="box"/>
  <text x="60" y="790" class="h">How a student's answer travels</text>
  <g class="s" font-size="14">
    <text x="60" y="820"><tspan class="lb">1  </tspan>Phone sends sync events: for each answer, the question id and the option text picked (never "I was right"). Each has a client id.</text>
    <text x="60" y="846"><tspan class="lb">2  </tspan>Server replies with the authoritative mastery, study minutes and mistake counts; the phone rebases onto it, keeping anything still unsent.</text>
    <text x="60" y="872"><tspan class="lb">3  </tspan>Teacher dashboard reads the class from the same tables: heatmap, groups, briefing. Changing the test date writes one row, and every plan and note follows it.</text>
    <text x="60" y="898"><tspan class="lb">4  </tspan>Parent note is built on request from that child's mastery, minutes, most common slip and the test date, in the chosen language.</text>
    <text x="60" y="924"><tspan class="lb">5  </tspan>SQLAlchemy persists everything. Re-sending the same batch is harmless; a student offline for days sends it all when back.</text>
  </g>
  <text x="60" y="956" class="s">Deploy: Dockerfile · docker-compose (Postgres) · render.yaml · GitHub Actions runs the 52 backend tests and a real-browser end-to-end check.</text>
</svg>
